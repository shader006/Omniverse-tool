services:
  gateway:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mediaflow_gateway
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./downloads:/app/downloads
      - ./frontend:/frontend:ro
    environment:
      - DOWNLOAD_DIR=/app/downloads
      - FRONTEND_DIR=/frontend
      - GOTENBERG_URL=http://gotenberg:3000
      - POGOCACHE_ADDR=pogocache:9401
      - WORKER_YTDLP_URL=http://worker-ytdlp:8001
      - WORKER_WHISPER_URL=http://worker-whisper:8002
      - WORKER_RMBG_URL=http://worker-rmbg:8003
      - MAX_MEDIA_CONCURRENT_JOBS=4
    depends_on:
      - gotenberg
      - pogocache
      - worker-ytdlp
      - worker-whisper
      - worker-rmbg

  worker-ytdlp:
    build:
      context: ./backend
      dockerfile: services/worker_ytdlp/Dockerfile
    container_name: mediaflow_worker_ytdlp
    restart: unless-stopped
    volumes:
      - ./downloads:/app/downloads
      - ./backend/app:/app/app
    environment:
      - DOWNLOAD_DIR=/app/downloads
      - PORT=8001

  worker-whisper:
    build:
      context: ./backend
      dockerfile: services/worker_whisper/Dockerfile
    container_name: mediaflow_worker_whisper
    restart: unless-stopped
    volumes:
      - ./downloads:/app/downloads
    environment:
      - DOWNLOAD_DIR=/app/downloads
      - PORT=8002

  worker-rmbg:
    build:
      context: ./backend
      dockerfile: services/worker_rmbg/Dockerfile
    container_name: mediaflow_worker_rmbg
    restart: unless-stopped
    volumes:
      - ./downloads:/app/downloads
      - ./models/birefnet:/root/.cache/birefnet
      - ./backend/app:/app/app
    environment:
      - DOWNLOAD_DIR=/app/downloads
      - PORT=8003
      - BIREFNET_CACHE_DIR=/root/.cache/birefnet

  pogocache:
    image: pogocache/pogocache:latest
    container_name: mediaflow_pogocache
    restart: unless-stopped
    ports:
      - "9401:9401"

  gotenberg:
    image: gotenberg/gotenberg:8
    container_name: mediaflow_gotenberg
    restart: unless-stopped
    ports:
      - "3000:3000"

  pingora:
    build:
      context: ./pingora
      dockerfile: Dockerfile
    container_name: mediaflow_pingora
    restart: unless-stopped
    ports:
      - "80:80"
    environment:
      - UPSTREAM_ADDR=gateway:8000
      - RUST_LOG=info
    depends_on:
      - gateway

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: mediaflow_tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - pingora

version: '3.8'

services:
  app:
    image: omniversetool-app:latest
    deploy:
      replicas: 1
      endpoint_mode: dnsrr
      restart_policy:
        condition: on-failure
      resources:
        limits:
          memory: 1024M
      update_config:
        parallelism: 1
        delay: 5s
        order: start-first
    environment:
      - DOWNLOAD_DIR=/app/downloads
      - GOTENBERG_URL=http://tasks.gotenberg:3000
      - POGOCACHE_ADDR=pogocache:9401
      - MAX_MEDIA_CONCURRENT_JOBS=2
      - PYTHONUNBUFFERED=1
      - WHISPER_MODEL_PATH=/app/models/whisper/ggml-small.bin
    volumes:
      - ${WORKSPACE_DIR:-.}/downloads:/app/downloads
      - ${WORKSPACE_DIR:-.}/frontend:/frontend:ro
      - ${WORKSPACE_DIR:-.}/tests:/app/tests:ro
    networks:
      - omniverse_net

  pogocache:
    image: pogocache/pogocache:latest
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      resources:
        limits:
          memory: 256M
    networks:
      - omniverse_net

  gotenberg:
    image: gotenberg/gotenberg:8
    deploy:
      replicas: 1
      endpoint_mode: dnsrr
      restart_policy:
        condition: on-failure
      resources:
        limits:
          memory: 1024M
      update_config:
        parallelism: 1
        delay: 5s
        order: start-first
    networks:
      - omniverse_net

  lightpanda:
    image: lightpanda/browser:nightly
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      resources:
        limits:
          memory: 256M
    networks:
      - omniverse_net

  pingora:
    image: omniversetool-pingora:latest
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
    ports:
      - target: 80
        published: 80
        protocol: tcp
        mode: host
    environment:
      - UPSTREAM_ADDR=tasks.app:8000
      - RUST_LOG=info
    networks:
      - omniverse_net

  tunnel:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
    networks:
      - omniverse_net

  autoscaler:
    image: omniversetool-autoscaler:latest
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
    environment:
      - SERVICES_CONFIG=omniverse_app:1:5:65.0:20.0:8,omniverse_gotenberg:1:4:70.0:25.0:8
      - SWARM_SERVICE_NAME=omniverse_app
      - MIN_REPLICAS=1
      - MAX_REPLICAS=5
      - CPU_SCALE_UP=65.0
      - CPU_SCALE_DOWN=20.0
      - CHECK_INTERVAL=8
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - omniverse_net

networks:
  omniverse_net:
    driver: overlay
    attachable: true

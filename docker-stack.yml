version: '3.8'

services:
  gateway:
    image: omniversetool-gateway:latest
    deploy:
      replicas: 1
      endpoint_mode: dnsrr
      restart_policy:
        condition: on-failure
      resources:
        limits:
          memory: 256M
      update_config:
        parallelism: 1
        delay: 2s
        order: stop-first
    ports:
      - target: 8000
        published: 8000
        protocol: tcp
        mode: host
    environment:
      - DOWNLOAD_DIR=/app/downloads
      - FRONTEND_DIR=/frontend
      - GOTENBERG_URL=http://tasks.gotenberg:3000
      - POGOCACHE_ADDR=tasks.pogocache:9401
      - WORKER_YTDLP_URL=http://tasks.worker-ytdlp:8001
      - WORKER_WHISPER_URL=http://tasks.worker-whisper:8002
      - WORKER_RMBG_URL=http://tasks.worker-rmbg:8003
      - MAX_MEDIA_CONCURRENT_JOBS=4
    volumes:
      - ${WORKSPACE_DIR:-.}/downloads:/app/downloads
      - ${WORKSPACE_DIR:-.}/frontend:/frontend:ro
    networks:
      - omniverse_net

  worker-ytdlp:
    image: omniversetool-worker-ytdlp:latest
    deploy:
      replicas: 1
      endpoint_mode: dnsrr
      restart_policy:
        condition: on-failure
      resources:
        limits:
          memory: 512M
    environment:
      - DOWNLOAD_DIR=/app/downloads
      - PORT=8001
    volumes:
      - ${WORKSPACE_DIR:-.}/downloads:/app/downloads
    networks:
      - omniverse_net

  worker-whisper:
    image: omniversetool-worker-whisper:latest
    deploy:
      replicas: 1
      endpoint_mode: dnsrr
      restart_policy:
        condition: on-failure
      resources:
        limits:
          memory: 1024M
    environment:
      - DOWNLOAD_DIR=/app/downloads
      - PORT=8002
    volumes:
      - ${WORKSPACE_DIR:-.}/downloads:/app/downloads
    networks:
      - omniverse_net

  worker-rmbg:
    image: omniversetool-worker-rmbg:latest
    deploy:
      replicas: 1
      endpoint_mode: dnsrr
      restart_policy:
        condition: any
        delay: 1s
      resources:
        limits:
          memory: 4096M
    environment:
      - DOWNLOAD_DIR=/app/downloads
      - PORT=8003
      - BIREFNET_CACHE_DIR=/root/.cache/birefnet
      - IDLE_RECYCLE_SECONDS=300
    volumes:
      - ${WORKSPACE_DIR:-.}/downloads:/app/downloads
      - ${WORKSPACE_DIR:-.}/models/birefnet:/root/.cache/birefnet
    networks:
      - omniverse_net

  pogocache:
    image: pogocache/pogocache:latest
    deploy:
      replicas: 1
      endpoint_mode: dnsrr
      restart_policy:
        condition: on-failure
      resources:
        limits:
          memory: 256M
    networks:
      - omniverse_net

  gotenberg:
    image: gotenberg/gotenberg:8
    deploy:
      replicas: 1
      endpoint_mode: dnsrr
      restart_policy:
        condition: on-failure
      resources:
        limits:
          memory: 1024M
      update_config:
        parallelism: 1
        delay: 5s
        order: start-first
    networks:
      - omniverse_net

  pingora:
    image: omniversetool-pingora:latest
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
    ports:
      - target: 80
        published: 80
        protocol: tcp
        mode: host
    environment:
      - UPSTREAM_ADDR=tasks.gateway:8000
      - RUST_LOG=info
    networks:
      - omniverse_net

  tunnel:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
    networks:
      - omniverse_net

  autoscaler:
    image: omniversetool-autoscaler:latest
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      placement:
        constraints:
          - node.role == manager
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - POGOCACHE_ADDR=pogocache:9401
      - SWARM_SERVICES=omniverse_worker-rmbg,omniverse_worker-whisper,omniverse_worker-ytdlp,omniverse_gotenberg
      - MIN_REPLICAS=1
      - MAX_REPLICAS=3
      - SCALE_DOWN_COOLDOWN_SEC=15
      - CHECK_INTERVAL=5
      - PRUNE_BUILD_CACHE=true
      - AUTO_PRUNE_INTERVAL_HOURS=6
    networks:
      - omniverse_net

networks:
  omniverse_net:
    driver: overlay
    attachable: true

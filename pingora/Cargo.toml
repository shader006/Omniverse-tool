[package]
name = "pingora_proxy"
version = "0.1.0"
edition = "2021"

[dependencies]
pingora = { git = "https://github.com/cloudflare/pingora", default-features = false, features = ["proxy", "lb"] }
async-trait = "0.1"
env_logger = "0.11"
log = "0.4"
rand = "0.8"
parking_lot = "0.12"
tokio = { version = "1.0", features = ["net"] }

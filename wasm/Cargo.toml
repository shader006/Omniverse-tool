[package]
name = "pixel_wasm"
version = "0.1.0"
edition = "2021"
description = "High-performance pixel art grid detection & processing engine compiled to WebAssembly"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6"
rustfft = "6"
console_error_panic_hook = { version = "0.1", optional = true }

[dependencies.web-sys]
version = "0.3"
features = [
  "console",
]

[dev-dependencies]
wasm-bindgen-test = "0.3"

[profile.release]
# Tối ưu kích thước binary siêu nhỏ và tốc độ cao
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
